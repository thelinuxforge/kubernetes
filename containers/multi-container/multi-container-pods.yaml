#Create a multi-container pod with 2 containers.
#Use the spec given below:
#If the pod goes into the crashloopbackoff then add the command sleep 1000 in the lemon container.

apiVersion: v1
kind: Pod
metadata:
  name: yellow
namespace: operations
spec:
  containers:
    - name: lemon
      image: busybox
      command:
        - sleep
        - "1000"
    - name: gold
      image: redis